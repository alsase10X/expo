<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Expo — PWA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== TOKENS — el selector light/dark de mañana solo cambia [data-theme] ===== */
:root,[data-theme="dark"]{
  --bg:#121211; --surface:#1c1c1a; --surface-2:#262623;
  --text:#f4f1ea; --text-mut:#a09c92; --text-dim:#6f6b62;
  --border:#2b2b28; --accent:#c9a25e; --accent-ink:#1a160d;
  --live:#7fae72; --danger:#d86c5a;
}
[data-theme="light"]{
  --bg:#faf8f3; --surface:#fff; --surface-2:#f0ede4;
  --text:#1a1916; --text-mut:#5f5b51; --text-dim:#908b80;
  --border:#e6e1d6; --accent:#a87f33; --accent-ink:#fff;
  --live:#4f7d43; --danger:#c0492f;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{background:#000;font-family:'Poppins',system-ui,sans-serif;font-weight:300;color:var(--text);
  display:flex;justify-content:center;align-items:flex-start;}
.app{width:100%;max-width:412px;height:100vh;background:var(--bg);
  position:relative;overflow:hidden;display:flex;flex-direction:column;}
@media(min-width:480px){
  body{padding:26px 0;align-items:center;background:#0a0a0a;}
  .app{height:884px;border-radius:38px;
    box-shadow:0 40px 90px -30px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.04);}
}

/* ===== Top bar ===== */
.topbar{position:absolute;top:0;left:0;right:0;z-index:30;height:60px;
  display:flex;align-items:center;gap:8px;padding:0 12px;
  background:linear-gradient(to bottom,var(--bg) 55%,transparent);}
.topbar .spacer{flex:1;}
.icon-btn{width:42px;height:42px;border-radius:50%;border:none;background:transparent;
  color:var(--text);cursor:pointer;display:grid;place-items:center;transition:background .2s;}
.icon-btn:hover{background:var(--surface-2);}.icon-btn:active{transform:scale(.92);}
.icon-btn.hidden{display:none;}
.icon-btn.liked svg{fill:var(--danger);stroke:var(--danger);}

/* ===== Contenido ===== */
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-top:60px;padding-bottom:74px;}
.content.has-mini{padding-bottom:132px;}
.content::-webkit-scrollbar{width:0;}
.view{animation:fade .4s ease;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.fu{opacity:0;transform:translateY(12px);animation:fade .5s cubic-bezier(.16,.84,.44,1) forwards;}
.h-display{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-.01em;font-optical-sizing:auto;}

/* ===== HOME ===== */
.home-hero{position:relative;height:300px;overflow:hidden;}
.home-hero img{width:100%;height:100%;object-fit:cover;}
.home-hero .grad{position:absolute;inset:0;background:linear-gradient(to top,var(--bg),transparent 60%);}
.home-body{padding:0 22px;margin-top:-46px;position:relative;}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;}
.home-title{font-size:38px;line-height:1.04;margin:8px 0 4px;}
.home-meta{color:var(--text-mut);font-size:15px;margin-top:10px;line-height:1.5;}
.home-intro{color:var(--text-mut);font-size:16px;line-height:1.62;margin-top:20px;}
.btn-primary{display:inline-flex;align-items:center;gap:9px;margin-top:24px;
  background:var(--accent);color:var(--accent-ink);border:none;cursor:pointer;
  font:inherit;font-weight:700;font-size:15px;padding:14px 22px;border-radius:12px;
  transition:filter .2s,transform .15s;}
.btn-primary:hover{filter:brightness(1.06);}.btn-primary:active{transform:scale(.98);}
.presskit{margin-top:32px;padding-top:22px;border-top:1px solid var(--border);}
.presskit a{display:inline-flex;align-items:center;gap:8px;color:var(--text-mut);font-size:13px;
  text-decoration:none;cursor:pointer;background:none;border:none;font:inherit;padding:0;}
.presskit a:hover{color:var(--text);}
.presskit a svg{color:var(--text-dim);}

/* ===== Page heads ===== */
.page-head{padding:6px 22px 18px;}
.page-head .kicker{margin-bottom:6px;}
.page-head h1{font-size:30px;line-height:1.06;}
.page-head p{color:var(--text-mut);font-size:15px;line-height:1.55;margin-top:10px;}

/* ===== Catálogo ===== */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 18px;}
.card{cursor:pointer;}
.card .ph{width:100%;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--surface);
  box-shadow:0 10px 26px -16px rgba(0,0,0,.6);transition:transform .25s;position:relative;}
.card .ph img{width:100%;height:100%;object-fit:cover;}
.card:active .ph{transform:scale(.97);}
.card .ph .corner{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 7px;border-radius:6px;backdrop-filter:blur(8px);}
.card .ph .corner.reserved{background:rgba(201,162,94,.85);color:#1a160d;}
.card .ph .corner.sold{background:rgba(216,108,90,.85);color:#fff;}
.card .ct{font-family:'Fraunces',serif;font-weight:600;font-size:15px;margin-top:9px;line-height:1.2;}
.card .ca{color:var(--text-mut);font-size:13px;margin-top:2px;}
.card .badge{display:inline-flex;align-items:center;gap:4px;margin-top:5px;
  font-size:11px;color:var(--text-dim);}

/* ===== Curatorial ===== */
.cura{padding:0 22px;color:var(--text-mut);font-size:16px;line-height:1.62;}
.cura.clamped p{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
.obras-sub{padding:26px 22px 14px;}
.obras-sub h2{font-family:'Fraunces',serif;font-weight:600;font-size:21px;letter-spacing:-.01em;}

/* ===== Obra ===== */
.artwork-wrap{padding:0 20px;}
.artwork{position:relative;width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;
  cursor:zoom-in;background:var(--surface);box-shadow:0 18px 50px -24px rgba(0,0,0,.7);}
.artwork img{width:100%;height:100%;object-fit:cover;display:block;}
.zoom-hint{position:absolute;right:12px;bottom:12px;width:34px;height:34px;border-radius:50%;
  background:rgba(0,0,0,.45);backdrop-filter:blur(6px);display:grid;place-items:center;
  color:#fff;opacity:.9;pointer-events:none;}
.head{padding:26px 22px 4px;}
.title{font-family:'Fraunces',serif;font-weight:600;font-size:32px;line-height:1.08;letter-spacing:-.01em;}
.artist-link{display:inline-flex;align-items:center;gap:11px;margin-top:18px;cursor:pointer;
  background:none;border:none;padding:0;font:inherit;color:var(--text);}
.artist-link .avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;overflow:hidden;
  border:1px solid var(--border);}
.artist-link .avatar img{width:100%;height:100%;object-fit:cover;}
.artist-link .name{font-weight:600;font-size:16px;border-bottom:1.5px solid transparent;transition:border-color .2s;}
.artist-link:hover .name{border-color:var(--accent);}
.artist-link .chev{color:var(--text-dim);}

/* ===== Status + precio ===== */
.status-row{padding:18px 22px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.status-chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.status-chip .dot{width:7px;height:7px;border-radius:50%;}
.status-chip.available{background:rgba(127,174,114,.16);color:#a8cf99;}
.status-chip.available .dot{background:#a8cf99;}
.status-chip.reserved{background:rgba(201,162,94,.18);color:var(--accent);}
.status-chip.reserved .dot{background:var(--accent);}
.status-chip.sold{background:rgba(216,108,90,.16);color:var(--danger);}
.status-chip.sold .dot{background:var(--danger);}
.price{font-family:'Fraunces',serif;font-weight:600;font-size:19px;color:var(--text);margin-left:auto;}

.desc{padding:18px 22px 0;color:var(--text-mut);font-size:16px;line-height:1.62;}
.desc.clamped p{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
.readmore{background:none;border:none;color:var(--text);font:inherit;font-weight:600;
  cursor:pointer;margin-top:6px;padding:0;}
.readmore:hover{color:var(--accent);}
.divider{height:1px;background:var(--border);margin:24px 22px;}
.section{padding:0 22px;}
.section h2{font-family:'Fraunces',serif;font-weight:600;font-size:21px;margin-bottom:16px;letter-spacing:-.01em;}

/* Audio inline */
.audio{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:15px 16px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;}
.audio .body{flex:1;min-width:0;}
.audio .label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);
  font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:7px;}
.audio .t{font-weight:600;font-size:15px;line-height:1.3;}
.audio .play{width:46px;height:46px;border-radius:50%;flex-shrink:0;border:none;
  background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center;
  transition:transform .15s;}
.audio .play:active{transform:scale(.9);}
.audio-prog{margin-top:0;padding:0 2px;display:flex;align-items:center;gap:10px;
  max-height:0;overflow:hidden;opacity:0;transition:max-height .35s,opacity .3s,margin .35s;}
.audio.active .audio-prog{max-height:40px;opacity:1;margin-top:14px;}
.audio-prog .track{flex:1;height:4px;border-radius:3px;background:var(--surface-2);position:relative;cursor:pointer;}
.audio-prog .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);border-radius:3px;}
.audio-prog .time{font-size:12px;color:var(--text-mut);font-variant-numeric:tabular-nums;min-width:36px;}
.eq{display:none;align-items:flex-end;gap:2px;height:11px;}
.eq.on{display:inline-flex;}
.eq span{width:2.5px;background:var(--live);border-radius:2px;height:30%;}
.eq.on span{animation:eq .9s ease-in-out infinite;}
.eq span:nth-child(2){animation-delay:.2s;}.eq span:nth-child(3){animation-delay:.4s;}
@keyframes eq{0%,100%{height:30%;}50%{height:100%;}}

/* Detalles */
.detail{display:flex;align-items:center;gap:15px;padding:12px 0;}
.detail .ico{width:24px;color:var(--text-dim);flex-shrink:0;display:grid;place-items:center;}
.detail .val{font-size:15px;}
.detail .val small{display:block;color:var(--text-dim);font-size:12px;letter-spacing:.04em;
  text-transform:uppercase;margin-bottom:1px;}

/* Bloque de acciones (CTA comercial + escribir al artista) */
.actions-block{padding:26px 22px 8px;}
.cta{width:100%;border:none;cursor:pointer;background:var(--accent);color:var(--accent-ink);
  font:inherit;font-weight:700;font-size:16px;padding:17px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .15s,filter .2s;}
.cta:hover{filter:brightness(1.06);}.cta:active{transform:scale(.985);}
.cta.disabled{background:var(--surface-2);color:var(--text-mut);cursor:default;pointer-events:none;
  display:flex;align-items:center;justify-content:center;font-weight:600;}
.cta-note{text-align:center;color:var(--text-dim);font-size:12.5px;margin-top:10px;}
.btn-secondary{width:100%;border:1px solid var(--border);cursor:pointer;background:transparent;color:var(--text);
  font:inherit;font-weight:600;font-size:15px;padding:15px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;gap:9px;transition:background .2s,border-color .2s;}
.btn-secondary:hover{background:var(--surface);border-color:var(--text-dim);}
.btn-secondary:active{transform:scale(.985);}

/* ===== Artista ===== */
.bio-head{padding:8px 22px 0;display:flex;flex-direction:column;align-items:center;text-align:center;}
.bio-head .avatar{width:96px;height:96px;border-radius:50%;overflow:hidden;border:1px solid var(--border);margin-bottom:16px;}
.bio-head .avatar img{width:100%;height:100%;object-fit:cover;}
.bio-head h1{font-family:'Fraunces',serif;font-weight:600;font-size:28px;}
.bio-head .role{color:var(--text-mut);font-size:14px;margin-top:4px;}
.bio-text{padding:22px 22px 0;color:var(--text-mut);font-size:16px;line-height:1.66;}
.bio-section{padding:30px 22px 0;}
.bio-section h2{font-family:'Fraunces',serif;font-weight:600;font-size:20px;margin-bottom:14px;letter-spacing:-.01em;}
.exh-row,.award-row{padding:12px 0;border-bottom:1px solid var(--border);display:flex;
  justify-content:space-between;gap:16px;align-items:baseline;}
.exh-row:last-child,.award-row:last-child{border-bottom:none;}
.exh-row .lt,.award-row .at{font-size:15px;line-height:1.35;}
.exh-row .lt em{font-style:normal;font-weight:600;}
.exh-row .lt .ven{color:var(--text-mut);display:block;font-size:13px;margin-top:2px;}
.exh-row .lt .now{display:inline-block;margin-left:8px;color:var(--accent);font-weight:700;
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;vertical-align:middle;
  border:1px solid var(--accent);padding:1px 6px;border-radius:4px;}
.exh-row .ly,.award-row .ay{color:var(--text-dim);font-size:13px;
  font-variant-numeric:tabular-nums;white-space:nowrap;}
.links{display:flex;flex-wrap:wrap;gap:10px;}
.link-chip{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);
  border:1px solid var(--border);border-radius:999px;color:var(--text);text-decoration:none;
  font-size:13px;font-weight:500;cursor:pointer;transition:border-color .2s,background .2s;}
.link-chip:hover{border-color:var(--text-dim);background:var(--surface-2);}
.link-chip svg{color:var(--text-mut);}
.link-chip .url{color:var(--text-mut);font-weight:400;}
.bio-works{padding:30px 22px 0;}
.bio-works h2{font-family:'Fraunces',serif;font-weight:600;font-size:20px;margin-bottom:14px;letter-spacing:-.01em;}

/* Lista de artistas */
.artist-row{display:flex;align-items:center;gap:14px;padding:14px 22px;cursor:pointer;
  border-bottom:1px solid var(--border);}
.artist-row:active{background:var(--surface);}
.artist-row .avatar{width:52px;height:52px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1px solid var(--border);}
.artist-row .avatar img{width:100%;height:100%;object-fit:cover;}
.artist-row .info{flex:1;}
.artist-row .nm{font-family:'Fraunces',serif;font-weight:600;font-size:17px;}
.artist-row .sub{color:var(--text-mut);font-size:13px;margin-top:2px;}
.artist-row .chev{color:var(--text-dim);}

/* ===== Mini-barra ===== */
.mini{position:absolute;left:0;right:0;bottom:62px;z-index:25;display:none;
  background:var(--surface);border-top:1px solid var(--border);}
.mini.show{display:block;animation:slideup .35s cubic-bezier(.16,.84,.44,1);}
@keyframes slideup{from{transform:translateY(100%);}to{transform:none;}}
.mini .mprog{height:2.5px;background:var(--surface-2);position:relative;}
.mini .mfill{position:absolute;inset:0 auto 0 0;width:0;background:var(--live);}
.mini .row{display:flex;align-items:center;gap:12px;padding:9px 12px 10px;}
.mini .thumb{width:42px;height:42px;border-radius:8px;overflow:hidden;flex-shrink:0;cursor:pointer;}
.mini .thumb img{width:100%;height:100%;object-fit:cover;}
.mini .meta{flex:1;min-width:0;cursor:pointer;}
.mini .mt{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini .ma{color:var(--text-mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini .mplay{width:40px;height:40px;border-radius:50%;border:none;background:var(--accent);
  color:var(--accent-ink);cursor:pointer;display:grid;place-items:center;flex-shrink:0;}
.mini .mclose{width:34px;height:34px;border:none;background:transparent;color:var(--text-dim);
  cursor:pointer;display:grid;place-items:center;flex-shrink:0;}

/* ===== Nav ===== */
.bottomnav{position:absolute;left:0;right:0;bottom:0;z-index:24;height:62px;display:flex;
  border-top:1px solid var(--border);background:var(--bg);padding:0 4px;}
.bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;background:none;border:none;color:var(--text-dim);font:inherit;font-size:10.5px;
  font-weight:600;cursor:pointer;}
.bottomnav button.active{color:var(--text);}
.bottomnav button.dead{opacity:.55;}

/* ===== Lightbox ===== */
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.96);display:none;
  align-items:center;justify-content:center;opacity:0;transition:opacity .25s;touch-action:none;}
.lightbox.show{display:flex;opacity:1;}
.lightbox img{max-width:100%;max-height:100%;cursor:zoom-in;transition:transform .25s ease;
  transform-origin:center;will-change:transform;}
.lightbox.zoomed img{cursor:grab;transition:none;}
.lightbox .close{position:absolute;top:18px;right:18px;z-index:2;width:44px;height:44px;border-radius:50%;
  border:none;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;
  backdrop-filter:blur(8px);}

/* ===== Sheet (mensaje al artista) ===== */
.sheet{position:fixed;inset:0;z-index:110;display:none;background:rgba(0,0,0,.55);
  align-items:flex-end;justify-content:center;opacity:0;transition:opacity .25s;}
.sheet.show{display:flex;opacity:1;}
.sheet-content{background:var(--bg);width:100%;max-width:412px;border-radius:20px 20px 0 0;
  padding:18px 22px 28px;max-height:82vh;overflow-y:auto;
  animation:sheetup .35s cubic-bezier(.16,.84,.44,1);}
@keyframes sheetup{from{transform:translateY(100%);}to{transform:none;}}
.sheet-handle{width:38px;height:4px;border-radius:2px;background:var(--surface-2);margin:0 auto 14px;}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px;}
.sheet-title{font-family:'Fraunces',serif;font-weight:600;font-size:22px;letter-spacing:-.01em;}
.sheet-sub{color:var(--text-mut);font-size:13px;margin-bottom:18px;line-height:1.45;}
.sheet textarea,.sheet input{width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:14px;font:inherit;color:var(--text);font-size:15px;line-height:1.5;
  outline:none;transition:border-color .2s;}
.sheet textarea{resize:vertical;min-height:130px;}
.sheet input{padding:13px 14px;margin-top:12px;}
.sheet textarea:focus,.sheet input:focus{border-color:var(--accent);}
.sheet textarea::placeholder,.sheet input::placeholder{color:var(--text-dim);}
.sheet .send{margin-top:16px;}

/* ===== Toast ===== */
.toast{position:absolute;left:50%;bottom:86px;transform:translate(-50%,80px);background:var(--surface-2);
  color:var(--text);border:1px solid var(--border);border-radius:12px;padding:13px 18px;font-size:14px;
  font-weight:500;z-index:40;box-shadow:0 18px 40px -16px rgba(0,0,0,.7);opacity:0;
  transition:transform .4s cubic-bezier(.16,.84,.44,1),opacity .3s;max-width:88%;text-align:center;}
.toast.show{transform:translate(-50%,0);opacity:1;}
</style>
</head>
<body>
<div class="app" data-theme="dark">

  <header class="topbar">
    <button class="icon-btn hidden" id="backBtn" aria-label="Atrás">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <div class="spacer"></div>
    <button class="icon-btn hidden" id="likeBtn" aria-label="Favorito">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
    </button>
    <button class="icon-btn hidden" id="shareBtn" aria-label="Compartir">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><polyline points="8 7 12 3 16 7"/><path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/></svg>
    </button>
  </header>

  <main class="content" id="content"></main>

  <div class="mini" id="mini">
    <div class="mprog"><div class="mfill" id="mfill"></div></div>
    <div class="row">
      <div class="thumb" id="miniThumb"><img id="miniImg" alt=""></div>
      <div class="meta" id="miniMeta">
        <div class="mt" id="miniTitle"></div>
        <div class="ma" id="miniArtist"></div>
      </div>
      <button class="mplay" id="miniPlay" aria-label="Reproducir/Pausar">
        <svg id="miniIco" width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="mclose" id="miniClose" aria-label="Cerrar">

    </button>
    <button data-nav="obras">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Obras
    </button>

    <button data-nav="scan" class="dead">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/></svg>Escanear

  <button class="close" id="lbClose" aria-label="Cerrar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>

<!-- Sheet para escribir al artista -->
<div class="sheet" id="sheet">
  <div class="sheet-content">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div class="sheet-title" id="sheetTitle">Escribe al artista</div>
      <button class="icon-btn" id="sheetClose" aria-label="Cerrar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>

    <div class="sheet-sub" id="sheetSub"></div>
    <textarea id="sheetMsg" placeholder="Comparte una reflexión, una pregunta, o algo que te haya pasado al ver esta obra…"></textarea>
    <input id="sheetEmail" type="email" placeholder="Tu email (opcional, solo si quieres respuesta)">
    <button class="cta send" id="sheetSend">Enviar mensaje</button>
  </div>
</div>

<script>
/* ================= IMÁGENES PLACEHOLDER ================= */
function makeArt(c){return "data:image/svg+xml;utf8,"+encodeURIComponent(
`<svg xmlns='http://www.w3.org/2000/svg' width='900' height='900' viewBox='0 0 900 900'>
<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
<stop offset='0' stop-color='${c[0]}'/><stop offset='.5' stop-color='${c[1]}'/><stop offset='1' stop-color='${c[2]}'/>
</linearGradient><radialGradient id='l' cx='.4' cy='.35' r='.7'>
<stop offset='0' stop-color='#fff' stop-opacity='.28'/><stop offset='1' stop-color='#fff' stop-opacity='0'/></radialGradient></defs>
<rect width='900' height='900' fill='url(#g)'/><rect width='900' height='900' fill='url(#l)'/>
<circle cx='300' cy='340' r='120' fill='${c[3]}' opacity='.55'/>
<rect x='480' y='430' width='260' height='300' rx='18' fill='${c[3]}' opacity='.4'/>
<path d='M0 650 Q220 560 450 660 T900 640 V900 H0 Z' fill='${c[2]}' opacity='.6'/></svg>`);}

/* ================= DATOS DE MUESTRA ================= */
const EXPO = {
  kicker:"Exposición colectiva",
  title:"Travesía",
  dates:"14 mayo – 28 junio 2026",
  sala:"Sala Municipal de Cultura · Logroño",
  intro:"Cuatro obras de dos autores que comparten una misma pregunta: qué queda del paisaje cuando se mira de cerca. Pintura, dibujo y técnica mixta en diálogo a lo largo de seis semanas.",
  curatorial:"Travesía reúne a dos autores que, sin haberse propuesto trabajar juntos, llevan años haciéndose la misma pregunta: qué queda de un lugar cuando se deja de mirarlo como paisaje y se empieza a mirarlo como materia. Elena Vázquez vuelve una y otra vez sobre la orilla y el agua quieta hasta vaciarlas de anécdota; Marc Oller deja que el óxido y el grafito erosionen la superficie como lo haría el tiempo a la intemperie. Lo que en una sala podrían parecer dos lenguajes opuestos —la veladura paciente frente al accidente provocado— se revela aquí como dos formas de la misma demora. La exposición propone un recorrido sin orden obligatorio: cada obra funciona sola, pero leídas en conjunto dibujan un mapa de lo que ambos entienden por permanencia.",
  cover:makeArt(['#2f4858','#476b6b','#26343a','#a7c4b5'])
};
const ARTISTS = {
  a1:{id:'a1',name:'Elena Vázquez',role:'Pintura · Logroño, 1988',
      avatar:makeArt(['#6b4a3a','#a9785a','#3f2c23','#e0b48f']),
      bio:"Elena Vázquez trabaja la pintura como un ejercicio de demora: vuelve una y otra vez sobre el mismo motivo —la orilla, la ventana, el agua quieta— hasta que el asunto deja de importar y solo queda la materia. Su obra se ha mostrado en espacios municipales y ferias de pequeño formato del norte peninsular.",
      exhibitions:[
        {title:'Travesía',venue:'Sala Municipal de Cultura',city:'Logroño',year:'2026',current:true},
        {title:'Espacio abierto 2024',venue:'Casa de Cultura Ibercaja',city:'Zaragoza',year:'2024'}
      ],
      links:[
        {type:'instagram',url:'@elenavazquez.pintura'}
      ]},
  a2:{id:'a2',name:'Marc Oller',role:'Técnica mixta · Barcelona, 1979',
      avatar:makeArt(['#3a3f6b','#5a5fa9','#23263f','#9f9fe0']),
      bio:"Marc Oller combina grafito, óxidos y collage para construir superficies que parecen erosionadas por el tiempo. Le interesa el accidente controlado: dejar que el material decida una parte del resultado. Ha participado en residencias y convocatorias de arte emergente desde 2015.",
      exhibitions:[
        {title:'Travesía',venue:'Sala Municipal de Cultura',city:'Logroño',year:'2026',current:true},
        {title:'Erosiones',venue:'Galería Bermejo',city:'Madrid',year:'2024'},
        {title:'Materia y tiempo',venue:'Centre Tres',city:'Barcelona',year:'2023'},
        {title:'Joven arte mediterráneo',venue:'Fundació Setba',city:'Barcelona',year:'2022'},
        {title:'Primera piedra',venue:'Espai Zero',city:'Olot',year:'2020'}
      ],
      awards:[
        {title:'Premio BBVA Frontera de la Creación',year:'2024'},
        {title:'Beca de residencia Hangar',year:'2022'},
        {title:'Mención Fundación Vila Casas',year:'2020'}
      ],
      links:[
        {type:'web',url:'marcoller.com'},
        {type:'instagram',url:'@marcoller.estudio'},
        {type:'behance',url:'behance.net/marcoller'}
      ]}
};
const WORKS = [
  {id:'w1',title:'Marea baja',artist:'a1',year:'2023',technique:'Óleo sobre lienzo',dim:'80 × 100 cm',ref:'TR-01',
   img:makeArt(['#2f4858','#5d7d7d','#26343a','#bcd4c8']),hasAudio:true,audioLabel:'Voz de la artista',audioDur:134,
   desc:"La línea de la marea funciona como excusa: lo que la artista persigue es el momento en que el agua deja de reflejar y empieza a absorber la luz. No hay figuras, no hay anécdota; solo una franja de color que cambia según dónde te sitúes frente al cuadro.",
   commercial:{mode:'artist'}},
  {id:'w2',title:'Interior con ventana',artist:'a1',year:'2022',technique:'Acrílico sobre tabla',dim:'60 × 60 cm',ref:'TR-02',
   img:makeArt(['#5a4632','#8a6f4e','#33271b','#d8b78a']),hasAudio:false,
   desc:"Una habitación vacía y una ventana que no muestra nada concreto. La obra juega con el umbral entre lo que está dentro y lo que se intuye fuera, sin resolver del todo a qué lado pertenece la luz.",
   commercial:{mode:'none'}},
  {id:'w3',title:'Cobre y humo',artist:'a2',year:'2024',technique:'Técnica mixta sobre papel',dim:'120 × 90 cm',ref:'TR-03',
   img:makeArt(['#3a3340','#6b5a52','#241f29','#c79a78']),hasAudio:true,audioLabel:'Voz del artista',audioDur:188,
   desc:"Óxidos de cobre y veladuras de grafito construyen una superficie que parece llevar décadas a la intemperie. El humo no se representa: se sugiere por la forma en que el material se ha dejado correr sobre el papel.",
   commercial:{mode:'gallery',status:'available',price:'2.400 €'}},
  {id:'w4',title:'Estudio nº4',artist:'a2',year:'2023',technique:'Grafito sobre papel',dim:'50 × 40 cm',ref:'TR-04',
   img:makeArt(['#33373f','#565d68','#202329','#9aa4b0']),hasAudio:false,
   desc:"Parte de una serie de estudios preparatorios. El trazo queda visible, sin corregir, como un registro del propio proceso de pensar la imagen antes de fijarla.",
   commercial:{mode:'gallery',status:'reserved',price:'850 €'}}
];
const workById = id => WORKS.find(w=>w.id===id);
const isGroupShow = new Set(WORKS.map(w=>w.artist)).size > 1;

/* ================= ESTADO ================= */
let view='home', currentWork=null, currentArtist=null;
const histStack=[];
let nowPlaying=null;
let timer=null;
const $ = id => document.getElementById(id);
const fmt = s => Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');

/* ================= ROUTER ================= */
function go(v, opts={}, push=true){
  if(push && view) histStack.push({view, currentWork, currentArtist});
  view=v;
  if(opts.work!==undefined) currentWork=opts.work;
  if(opts.artist!==undefined) currentArtist=opts.artist;
  render();
}
function back(){
  const prev=histStack.pop();
  if(prev){view=prev.view;currentWork=prev.currentWork;currentArtist=prev.currentArtist;render();}
  else go('home',{},false);
}
$('backBtn').onclick=back;

/* ================= RENDER ================= */
function render(){
  const c=$('content');
  const onDetail = (view==='obra'||view==='artist');
  $('backBtn').classList.toggle('hidden', !(histStack.length>0));
  $('likeBtn').classList.toggle('hidden', view!=='obra');
  $('shareBtn').classList.toggle('hidden', !onDetail);
  document.querySelectorAll('#nav button').forEach(b=>{
    const map={home:'home',obras:'obras',obra:'obras',artists:'artists',artist:'artists'};
    b.classList.toggle('active', b.dataset.nav===map[view]);
  });
  $('navArtistLbl').textContent = isGroupShow ? 'Artistas' : 'Artista';

  if(view==='home') c.innerHTML=tplHome();
  else if(view==='obras') c.innerHTML=tplObras();
  else if(view==='obra') c.innerHTML=tplObra(workById(currentWork));
  else if(view==='artists') c.innerHTML=tplArtists();
  else if(view==='artist') c.innerHTML=tplArtist(currentArtist);
  c.scrollTop=0;
  bindView();
  updateInline();
}

/* ---- Templates ---- */
function tplHome(){return `<div class="view">
  <div class="home-hero"><img src="${EXPO.cover}" alt=""><div class="grad"></div></div>
  <div class="home-body fu">
    <div class="kicker">${EXPO.kicker}</div>
    <h1 class="home-title h-display">${EXPO.title}</h1>
    <div class="home-meta">${EXPO.dates}<br>${EXPO.sala}</div>
    <p class="home-intro">${EXPO.intro}</p>
    <button class="btn-primary" data-act="goObras">Ver las obras
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
    <div class="presskit"><button data-act="presskit">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Para prensa · descargar dossier de la exposición
    </button></div>
  </div></div>`;}

function tplObras(){
  const corner = w => w.commercial.status==='reserved' ? '<div class="corner reserved">Reservada</div>' :
                      w.commercial.status==='sold' ? '<div class="corner sold">Vendida</div>' : '';
  return `<div class="view">
  <div class="page-head fu"><div class="kicker">${EXPO.kicker}</div><h1 class="h-display">${EXPO.title}</h1></div>
  <div class="cura clamped fu" id="curaTxt"><p>${EXPO.curatorial}</p><button class="readmore" id="curaBtn">Leer más</button></div>
  <div class="obras-sub fu"><h2>Obras · ${WORKS.length}</h2></div>
  <div class="grid">${WORKS.map(w=>`
    <div class="card" data-work="${w.id}">
      <div class="ph"><img src="${w.img}" alt="${w.title}">${corner(w)}</div>
      <div class="ct">${w.title}</div>
      <div class="ca">${ARTISTS[w.artist].name}</div>
      ${w.hasAudio?`<div class="badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M19 5a9 9 0 0 1 0 14M15.5 8.5a4 4 0 0 1 0 7"/></svg>Audio</div>`:''}
    </div>`).join('')}</div></div>`;}

function tplObra(w){
  const a = ARTISTS[w.artist];
  const c = w.commercial;
  const firstName = a.name.split(' ')[0];

  // Status + precio
  let statusRow = '';
  if(c.mode === 'gallery' && c.status){
    const labels = {available:'Disponible', reserved:'Reservada', sold:'Vendida'};
    statusRow = `<div class="status-row fu">
      <span class="status-chip ${c.status}"><span class="dot"></span>${labels[c.status]}</span>
      ${c.price ? `<span class="price">${c.price}</span>` : ''}
    </div>`;
  }

  // Bloque de audio
  const audioBlock = w.hasAudio ? `<div class="divider"></div>
    <section class="section fu"><h2>Audio</h2>
      <div class="audio" id="audio">
        <div class="body">
          <div class="label">${w.audioLabel}<span class="eq" id="inlineEq"><span></span><span></span><span></span></span></div>
          <div class="t">Escucha sobre esta obra</div>
        </div>
        <button class="play" id="playBtn" aria-label="Reproducir"><svg id="playIco" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <div class="audio-prog" id="audioProg" style="flex-basis:100%;">
          <span class="time" id="cur">0:00</span>
          <div class="track" id="track"><div class="fill" id="fill"></div></div>
          <span class="time">${fmt(w.audioDur)}</span>
        </div>
      </div></section>` : '';

  // CTA comercial (varía según régimen)
  const sendIco = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>`;
  let commCta = '';
  if(c.mode === 'artist'){
    commCta = `<button class="cta" data-act="interest">${sendIco}Me interesa esta obra</button>
      <p class="cta-note">Te pondremos en contacto con la artista</p>`;
  } else if(c.mode === 'gallery' && c.status === 'available'){
    commCta = `<button class="cta" data-act="interest">${sendIco}Consultar disponibilidad</button>
      <p class="cta-note">Te pondremos en contacto con la sala</p>`;
  } else if(c.mode === 'gallery' && c.status === 'reserved'){
    commCta = `<div class="cta disabled">Obra reservada</div>
      <button class="btn-secondary" data-act="waitlist" style="margin-top:12px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Apuntarme a la lista de espera
      </button>
      <p class="cta-note">Te avisaremos si vuelve a estar disponible</p>`;
  } else if(c.mode === 'gallery' && c.status === 'sold'){
    commCta = `<div class="cta disabled">Obra vendida</div>`;
  }

  // Botón "Escribe al artista" (siempre)
  const writeIco = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>`;
  const msgBtn = `<button class="btn-secondary" data-act="message" ${commCta?'style="margin-top:14px;"':''}>${writeIco}Escribe a ${firstName}</button>`;

  return `<div class="view">
    <div class="artwork-wrap fu"><div class="artwork" data-act="zoom"><img src="${w.img}" alt="${w.title}">
      <div class="zoom-hint"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></div>
    </div></div>
    <div class="head fu"><h1 class="title">${w.title}</h1>
      <button class="artist-link" data-artist="${w.artist}">
        <span class="avatar"><img src="${a.avatar}" alt=""></span>
        <span class="name">${a.name}</span>
        <span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
      </button></div>
    ${statusRow}
    <div class="desc clamped fu" id="desc"><p>${w.desc}</p><button class="readmore" id="readmore">Leer más</button></div>
    ${audioBlock}
    <div class="divider"></div>
    <section class="section fu"><h2>Detalles</h2>
      ${detailRow('M6 2h12M6 22h12M6 2c0 5 4 7 6 10 2-3 6-5 6-10M6 22c0-5 4-7 6-10 2 3 6 5 6 10','Año',w.year)}
      ${detailRow('m12 19 7-7a2.8 2.8 0 0 0-4-4l-7 7M18 13 9.4 4.4a2 2 0 0 0-2.8 0L4.4 6.6a2 2 0 0 0 0 2.8L13 18','Técnica',w.technique)}
      ${detailRow('M3 21 21 3M21 3v6M21 3h-6M3 21v-6M3 21h6','Dimensiones',w.dim)}
      ${detailRow('m21 8-9-5-9 5 9 5 9-5zM3 8l9 5 9-5M3 16l9 5 9-5','Referencia',w.ref)}
    </section>
    <div class="actions-block fu">${commCta}${msgBtn}</div>
  </div>`;
}

function detailRow(d,label,val){return `<div class="detail"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg></span><span class="val"><small>${label}</small>${val}</span></div>`;}

function tplArtists(){
  if(!isGroupShow) return tplArtistInner(WORKS[0].artist);
  const ids=[...new Set(WORKS.map(w=>w.artist))];
  return `<div class="view"><div class="page-head fu"><div class="kicker">${EXPO.title}</div><h1 class="h-display">Artistas</h1><p>${ids.length} autores en esta exposición.</p></div>
  ${ids.map(id=>{const a=ARTISTS[id];const n=WORKS.filter(w=>w.artist===id).length;return `
    <div class="artist-row" data-artist="${id}"><span class="avatar"><img src="${a.avatar}" alt=""></span>
      <div class="info"><div class="nm">${a.name}</div><div class="sub">${a.role} · ${n} obra${n>1?'s':''}</div></div>
      <span class="chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span></div>`;}).join('')}</div>`;
}
function tplArtist(id){return `<div class="view">${tplArtistInner(id)}</div>`;}

function tplArtistInner(id){
  const a=ARTISTS[id];
  const ws=WORKS.filter(w=>w.artist===id);

  const exhSec = (a.exhibitions && a.exhibitions.length) ? `
    <div class="bio-section fu"><h2>Exposiciones</h2>
      ${a.exhibitions.map(e=>`
        <div class="exh-row">
          <div class="lt"><em>${e.title}</em>${e.current?'<span class="now">Actual</span>':''}<span class="ven">${e.venue} · ${e.city}</span></div>
          <div class="ly">${e.year}</div>
        </div>`).join('')}
    </div>` : '';

  const awardsSec = (a.awards && a.awards.length) ? `
    <div class="bio-section fu"><h2>Premios y reconocimientos</h2>
      ${a.awards.map(p=>`
        <div class="award-row">
          <div class="at">${p.title}</div>
          <div class="ay">${p.year}</div>
        </div>`).join('')}
    </div>` : '';

  const iconMap = {
    web:'<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10z"/>',
    instagram:'<rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.5" fill="currentColor"/>',
    behance:'<path d="M2 6h7a3 3 0 0 1 0 6H2zM2 12h8a3 3 0 0 1 0 6H2zM15 9h7M15 14h7a3 3 0 0 0-6 0"/>'
  };
  const labelMap = {web:'Web',instagram:'Instagram',behance:'Behance'};
  const linksSec = (a.links && a.links.length) ? `
    <div class="bio-section fu"><h2>Enlaces</h2>
      <div class="links">${a.links.map(l=>`
        <button class="link-chip" data-link="${l.url}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${iconMap[l.type]||''}</svg>
          ${labelMap[l.type]||l.type} <span class="url">${l.url}</span>
        </button>`).join('')}
      </div>
    </div>` : '';

  return `<div class="bio-head fu"><span class="avatar"><img src="${a.avatar}" alt=""></span>
    <h1>${a.name}</h1><div class="role">${a.role}</div></div>
  <p class="bio-text fu">${a.bio}</p>
  <div class="bio-works fu"><h2>En esta exposición</h2>
    <div class="grid" style="padding:0;">${ws.map(w=>`
      <div class="card" data-work="${w.id}"><div class="ph"><img src="${w.img}" alt="${w.title}"></div>
        <div class="ct">${w.title}</div><div class="ca">${w.year}</div></div>`).join('')}</div></div>
  ${exhSec}${awardsSec}${linksSec}
  <div style="height:24px;"></div>`;
}

/* ---- Bind tras render ---- */
function bindView(){
  const acts = {
    goObras: ()=>go('obras'),
    zoom: openLb,
    presskit: ()=>showToast('Descargando dossier de prensa…'),
    interest: ()=>{
      const w=workById(currentWork);
      const target = w.commercial.mode==='gallery' ? 'sala' : 'artista';
      showToast(`Solicitud enviada. La ${target} te contactará pronto.`);
    },
    waitlist: ()=>showToast('Apuntado a la lista de espera. Te avisaremos.'),
    message: openSheet
  };
  document.querySelectorAll('[data-work]').forEach(el=>el.onclick=()=>go('obra',{work:el.dataset.work}));
  document.querySelectorAll('[data-artist]').forEach(el=>el.onclick=()=>go('artist',{artist:el.dataset.artist}));
  document.querySelectorAll('[data-link]').forEach(el=>el.onclick=ev=>{ev.preventDefault();showToast('Enlace externo (prototipo)');});
  document.querySelectorAll('[data-act]').forEach(el=>{const a=el.dataset.act;if(acts[a]) el.onclick=acts[a];});
  const rm=$('readmore'); if(rm) rm.onclick=()=>{const d=$('desc');d.classList.toggle('clamped');rm.textContent=d.classList.contains('clamped')?'Leer más':'Leer menos';};
  const cb=$('curaBtn'); if(cb) cb.onclick=()=>{const d=$('curaTxt');d.classList.toggle('clamped');cb.textContent=d.classList.contains('clamped')?'Leer más':'Leer menos';};
  const pb=$('playBtn'); if(pb) pb.onclick=()=>playWork(currentWork);
  const track=$('track'); if(track) track.onclick=e=>{const r=track.getBoundingClientRect();seek((e.clientX-r.left)/r.width);};
}

/* ================= AUDIO (simulado) ================= */
function playWork(id){
  if(nowPlaying && nowPlaying.workId===id){togglePlay();return;}
  nowPlaying={workId:id, t:0, playing:true};
  startTimer(); refreshAudioUI();
}
function togglePlay(){ if(!nowPlaying)return; nowPlaying.playing=!nowPlaying.playing; nowPlaying.playing?startTimer():stopTimer(); refreshAudioUI(); }
function seek(frac){ if(!nowPlaying)return; const w=workById(nowPlaying.workId); nowPlaying.t=Math.max(0,Math.min(1,frac))*w.audioDur; refreshAudioUI(); }
function startTimer(){ stopTimer(); timer=setInterval(()=>{const w=workById(nowPlaying.workId);nowPlaying.t++;if(nowPlaying.t>=w.audioDur){nowPlaying.t=w.audioDur;togglePlay();}refreshAudioUI();},1000); }
function stopTimer(){ if(timer){clearInterval(timer);timer=null;} }
function closeAudio(){ stopTimer(); nowPlaying=null; refreshAudioUI(); }

const PLAY='<path d="M8 5v14l11-7z"/>', PAUSE='<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
function refreshAudioUI(){ updateMini(); updateInline(); }
function updateMini(){
  const mini=$('mini'), c=$('content');
  if(!nowPlaying){ mini.classList.remove('show'); c.classList.remove('has-mini'); return; }
  const w=workById(nowPlaying.workId), a=ARTISTS[w.artist];
  mini.classList.add('show'); c.classList.add('has-mini');
  $('miniImg').src=w.img; $('miniTitle').textContent=w.title; $('miniArtist').textContent=a.name;
  $('miniIco').innerHTML=nowPlaying.playing?PAUSE:PLAY;
  $('mfill').style.width=(nowPlaying.t/w.audioDur*100)+'%';
}
function updateInline(){
  if(view!=='obra')return;
  const audio=$('audio'); if(!audio)return;
  const playing = nowPlaying && nowPlaying.workId===currentWork;
  audio.classList.toggle('active', !!playing);
  const eq=$('inlineEq'); if(eq) eq.classList.toggle('on', !!(playing&&nowPlaying.playing));
  const ico=$('playIco'); if(ico) ico.innerHTML=(playing&&nowPlaying.playing)?PAUSE:PLAY;
  if(playing){ const w=workById(currentWork); $('fill').style.width=(nowPlaying.t/w.audioDur*100)+'%'; $('cur').textContent=fmt(nowPlaying.t); }
}
$('miniPlay').onclick=togglePlay;
$('miniClose').onclick=closeAudio;
$('miniThumb').onclick=()=>go('obra',{work:nowPlaying.workId});
$('miniMeta').onclick=()=>go('obra',{work:nowPlaying.workId});

/* ================= NAV ================= */
document.querySelectorAll('#nav button').forEach(b=>{
  b.onclick=()=>{const n=b.dataset.nav;
    if(n==='scan')return;
    histStack.length=0;
    if(n==='home')go('home',{},false);
    else if(n==='obras')go('obras',{},false);
    else if(n==='artists')go('artists',{},false);
  };
});

/* ================= LIGHTBOX ================= */
const lb=$('lightbox'), lbImg=$('lbImg');
let z=1,px=0,py=0,drag=false,sx=0,sy=0;
function applyT(){lbImg.style.transform=`translate(${px}px,${py}px) scale(${z})`;}
function openLb(){const w=workById(currentWork);lbImg.src=w.img;lb.classList.add('show');z=1;px=0;py=0;applyT();lb.classList.remove('zoomed');}
function closeLb(){lb.classList.remove('show','zoomed');}
$('lbClose').onclick=closeLb;
lb.onclick=e=>{if(e.target===lb)closeLb();};
lbImg.onclick=e=>{e.stopPropagation();if(z===1){z=2.4;lb.classList.add('zoomed');}else{z=1;px=0;py=0;lb.classList.remove('zoomed');}applyT();};
lbImg.addEventListener('pointerdown',e=>{if(z===1)return;drag=true;sx=e.clientX-px;sy=e.clientY-py;lbImg.setPointerCapture(e.pointerId);});
lbImg.addEventListener('pointermove',e=>{if(!drag)return;px=e.clientX-sx;py=e.clientY-sy;applyT();});
lbImg.addEventListener('pointerup',()=>drag=false);

/* ================= SHEET — escribir al artista ================= */
function openSheet(){
  const w=workById(currentWork); const a=ARTISTS[w.artist];
  $('sheetTitle').textContent = `Escribe a ${a.name.split(' ')[0]}`;
  $('sheetSub').textContent = `Tu mensaje irá directo a ${a.name}, sobre la obra "${w.title}".`;
  $('sheetMsg').value=''; $('sheetEmail').value='';
  $('sheet').classList.add('show');
  setTimeout(()=>$('sheetMsg').focus(),300);
}
function closeSheet(){ $('sheet').classList.remove('show'); }
function sendSheet(){
  if(!$('sheetMsg').value.trim()){ $('sheetMsg').focus(); return; }
  closeSheet();
  showToast('Mensaje enviado. ¡Gracias por compartir!');
}
$('sheet').addEventListener('click', e=>{ if(e.target===$('sheet')) closeSheet(); });
$('sheetClose').onclick=closeSheet;
$('sheetSend').onclick=sendSheet;

/* ================= MISC ================= */
$('likeBtn').onclick=e=>e.currentTarget.classList.toggle('liked');
$('shareBtn').onclick=()=>showToast('Enlace copiado para compartir');
let toastT=null;
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}

document.addEventListener('keydown',e=>{ if(e.key==='Escape'){closeLb();closeSheet();} });

render();
</script>
